[project]
name = "commenttool"
version = "0.1.0"
description = "Flag and rewrite AI-smelling / redundant comments in a repo, via diff review."
requires-python = ">=3.10"

dependencies = [
    "tree-sitter>=0.23",
    "tree-sitter-language-pack>=1.12",
    "anthropic>=0.72",
    "click>=8.1",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
]

[project.scripts]
commenttool = "commenttool.cli:main"

[build-system]
requires = [
    "setuptools>=68",
    "wheel",
]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]